[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-patrol-ai"
version = "0.1.0"
description = "Configurable vision-based obstruction monitoring prototype"
requires-python = ">=3.10"
dependencies = ["ultralytics>=8.3,<9.0", "opencv-python>=4.8", "numpy>=1.24"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
